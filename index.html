<title>Gestão de Rastreadores</title>
<script>
  // Busca o link ATUAL em link.json sem cache (o navegador e o GitHub guardam esta página por até
  // 10 min; o Edge principalmente). Se não conseguir, usa o link gravado abaixo.
  (function () {
    var reserva = "https://catch-orbit-signature-mask.trycloudflare.com", foi = false;
    function ir(l) { if (foi) return; foi = true; location.replace(String(l).replace(/[/]+$/, "") + "/" + location.search); }
    try {
      fetch("link.json?t=" + Date.now(), {cache: "no-store"})
        .then(function (r) { return r.json(); })
        .then(function (d) { ir(d && d.link ? d.link : reserva); })
        .catch(function () { ir(reserva); });
    } catch (e) { ir(reserva); }
    setTimeout(function () { ir(reserva); }, 4000);
  })();
</script>
