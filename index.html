<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Gestão de Rastreadores</title>
<script>
  // Busca o link ATUAL em link.json sem cache (o navegador e o GitHub guardam esta página por até
  // 10 min; o Edge principalmente). Se link.json disser que o link está sendo renovado (queda de
  // internet no computador do painel), mostra "aguarde" e tenta de novo sozinha. Se não conseguir
  // ler link.json, usa o link gravado abaixo.
  (function () {
    var reserva = "https://working-mineral-monsters-controversy.trycloudflare.com", foi = false, esperando = false;
    function ir(l) { if (foi) return; foi = true; location.replace(String(l).replace(/[/]+$/, "") + "/" + location.search); }
    function aguardar() {
      esperando = true;
      var p = document.getElementById("msg");
      if (p) p.textContent = "O link do painel está sendo renovado (o computador do painel perdeu a internet por um instante). "
        + "Esta página tenta de novo sozinha a cada 15 segundos; não precisa fazer nada.";
      setTimeout(buscar, 15000);
    }
    function buscar() {
      try {
        fetch("link.json?t=" + Date.now(), {cache: "no-store"})
          .then(function (r) { return r.json(); })
          .then(function (d) { if (d && d.link) ir(d.link); else if (d && d.aguarde) aguardar(); else ir(reserva); })
          .catch(function () { if (!esperando) ir(reserva); else setTimeout(buscar, 15000); });
      } catch (e) { ir(reserva); }
    }
    buscar();
    setTimeout(function () { if (!esperando) ir(reserva); }, 4000);
  })();
</script>
